services:
  postgres:
    image: postgres:16-alpine
    container_name: monetify-db
    environment:
      POSTGRES_USER: monetify
      POSTGRES_PASSWORD: monetify
      POSTGRES_DB: monetify
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
